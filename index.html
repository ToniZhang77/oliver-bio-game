<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oliver 的生物观察站</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #eef5ea; color: #24402b;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    font-size: 20px; line-height: 1.6;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center;
    padding: 12px 24px; background: #3f7d4e; color: #fff;
  }
  header h1 { margin: 0; font-size: 24px; }
  main { max-width: 860px; margin: 0 auto; padding: 24px; text-align: center; }
  button {
    font: inherit; cursor: pointer; border: 2px solid #3f7d4e; border-radius: 14px;
    background: #fff; color: #24402b; padding: 10px 20px; touch-action: manipulation;
  }
  button:hover:not(:disabled) { background: #dcecd6; }
  button:focus-visible { outline: 4px solid #f0b429; }
  header button { border-color: #fff; background: transparent; color: #fff; font-size: 16px; margin-left: 8px; }
  header button:hover:not(:disabled) { background: #356a42; }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 24px 0; }
  .menu button { padding: 24px 12px; font-size: 22px; }
  .menu .big { font-size: 56px; display: block; }
  .menu small { display: block; font-size: 16px; color: #567; }
  .primary { background: #3f7d4e; color: #fff; font-size: 22px; padding: 14px 32px; }
  .primary:hover:not(:disabled) { background: #356a42; }
  .hint { font-size: 22px; margin: 8px 0 16px; }
  .emoji { font-size: 44px; line-height: 1; vertical-align: middle; }
  .grid {
    --cell: min(76px, calc((100vw - 32px - (var(--cols) - 1) * 8px) / var(--cols)));
    display: grid; grid-template-columns: repeat(var(--cols), var(--cell));
    gap: 8px; justify-content: center; margin: 16px auto;
  }
  .grid button { width: var(--cell); height: var(--cell); padding: 0; font-size: calc(var(--cell) * 0.55); line-height: 1; border-color: #b9d3b0; }
  .grid button.found { background: #bfe5b3; border-color: #3f7d4e; cursor: default; }
  .grid button.nope { background: #f3e3c3; }
  .stage {
    --stage: min(260px, 60vw);
    width: var(--stage); height: var(--stage); margin: 16px auto; border-radius: 50%;
    background: #cfe6c5; display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--stage) / 2); line-height: 1;
  }
  .msg { min-height: 36px; font-size: 22px; }
  .slots { display: flex; justify-content: center; gap: 8px; margin: 12px 0; min-height: 64px; }
  .slots span {
    --slot: min(60px, 13vw);
    width: var(--slot); height: var(--slot); border: 2px dashed #8fb284; border-radius: 12px;
    font-size: calc(var(--slot) * 0.62); line-height: calc(var(--slot) - 4px);
  }
  .card {
    display: inline-block; width: 260px; max-width: calc(100% - 16px); margin: 8px; padding: 16px; border-radius: 16px;
    background: #fff; border: 2px solid #3f7d4e; text-align: left; font-size: 17px; vertical-align: top;
  }
  .card .pic { font-size: 64px; text-align: center; line-height: 1.2; }
  .card h3 { margin: 4px 0; text-align: center; font-size: 22px; }
  .card.locked { border-style: dashed; border-color: #b5c4b0; color: #9aa; text-align: center; }
  .card p { margin: 4px 0; }
  .progress { color: #567; font-size: 17px; }
  details { text-align: left; margin-top: 32px; font-size: 16px; color: #456; }
  .fruit-pic {
    width: min(220px, 60vw); height: min(220px, 60vw); object-fit: contain;
    background: #fff; border: 2px solid #b9d3b0; border-radius: 20px; padding: 10px;
  }
  .fruit-name { font-size: 36px; font-weight: bold; margin: 8px 0; }
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 520px; margin: 16px auto; }
  .options button { font-size: 22px; padding: 16px 8px; min-height: 64px; }
  .options button.found { background: #bfe5b3; }
  .options button.nope { background: #f3e3c3; color: #998; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; margin: 16px 0; }
  .tile { background: #fff; border: 2px solid #b9d3b0; border-radius: 12px; padding: 8px 4px; font-size: 16px; line-height: 1.3; }
  .tile img { width: 64px; height: 64px; object-fit: contain; }
  .tile.known { border-color: #3f7d4e; }
  .tile small { display: block; color: #567; }
  .scene {
    max-width: 520px; min-height: 2.8em; margin: 12px auto; padding: 12px; border-radius: 20px;
    background: #cfe6c5; font-size: min(44px, 9vw); line-height: 1.3;
  }
  .scene span { display: inline-block; }
  .scene .in { animation: hop-in 0.6s ease-out both; }
  .scene .out { animation: leave 0.9s ease-in both; }
  @keyframes hop-in { from { opacity: 0; transform: translateY(-40px); } 70% { transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0.2; transform: translateY(-14px) rotate(15deg); } }
  @media (prefers-reduced-motion: reduce) { .scene .in { animation: none; } .scene .out { animation: none; opacity: 0.2; } }
  .equation { font-size: min(44px, 11vw); font-weight: bold; margin: 8px 0; }
  .options.nums { grid-template-columns: repeat(4, 1fr); }
  .options.nums button { font-size: 30px; padding: 12px 0; }
  .options.hanzi button { font-size: 34px; padding: 8px 0; }
  .glyph { width: 100%; height: 100%; fill: currentColor; display: block; }
  .bone {
    width: min(220px, 60vw); height: min(220px, 60vw); margin: 0 auto; padding: 16px;
    background: #f4ead2; border: 2px solid #c9b88a; border-radius: 20px; color: #4a3a1c;
  }
  .evo { display: flex; justify-content: center; align-items: center; gap: 6px; margin: 12px 0; }
  .evo figure { margin: 0; animation: hop-in 0.6s ease-out both; }
  .evo .box {
    width: min(120px, 24vw); height: min(120px, 24vw); padding: 8px; border-radius: 14px;
    background: #fff; border: 2px solid #b9d3b0; display: flex; align-items: center; justify-content: center;
    font-size: min(84px, 17vw); line-height: 1; font-family: "KaiTi", "STKaiti", "Kaiti SC", serif;
  }
  .evo .box.old { background: #f4ead2; border-color: #c9b88a; color: #4a3a1c; }
  .evo figcaption { font-size: 15px; color: #567; line-height: 1.3; margin-top: 4px; }
  .evo .arrow { font-size: 24px; color: #8fb284; animation: hop-in 0.6s ease-out both; }
  @media (prefers-reduced-motion: reduce) { .evo figure, .evo .arrow { animation: none; } }
  .tile .mini { width: 64px; height: 64px; margin: 0 auto; color: #4a3a1c; }
  @media (max-width: 600px) {
    body { font-size: 18px; }
    header { padding: 8px 12px; }
    header h1 { font-size: 19px; }
    header button { font-size: 14px; padding: 6px 10px; margin-left: 4px; }
    main { padding: 12px; }
    .menu { grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .menu button { padding: 14px 6px; font-size: 19px; }
    .menu .big { font-size: 44px; }
    .menu small { font-size: 14px; }
    .hint, .msg { font-size: 19px; }
    .emoji { font-size: 34px; }
    .fruit-name { font-size: 30px; }
    .options button { font-size: 19px; }
  }
</style>
</head>
<body>
<header>
  <h1>🔬 Oliver 的生物观察站</h1>
  <div>
    <button id="soundBtn"></button>
    <button id="homeBtn">🏕️ 回营地</button>
  </div>
</header>
<main id="app"></main>

<script src="glyphs.js"></script>
<script>
const ANIMALS = [
  { id: 'bee', e: '🐝', name: '蜜蜂', eats: '花蜜和花粉', lives: '蜂巢', fact: '会用"跳舞"告诉同伴花在哪里。' },
  { id: 'butterfly', e: '🦋', name: '蝴蝶', eats: '花蜜', lives: '花丛和草地', fact: '用脚来尝味道。' },
  { id: 'ant', e: '🐜', name: '蚂蚁', eats: '种子、小虫、甜的东西', lives: '地下的蚁巢', fact: '能搬动比自己重很多倍的东西。' },
  { id: 'ladybug', e: '🐞', name: '瓢虫', eats: '蚜虫', lives: '叶子和草丛', fact: '一天能吃掉几十只蚜虫，是植物的好帮手。' },
  { id: 'snail', e: '🐌', name: '蜗牛', eats: '叶子和嫩芽', lives: '潮湿的草丛', fact: '舌头上有成千上万颗小牙齿。' },
  { id: 'spider', e: '🕷️', name: '蜘蛛', eats: '小昆虫', lives: '蛛网或洞穴', fact: '有 8 条腿，所以它不是昆虫。' },
  { id: 'caterpillar', e: '🐛', name: '毛毛虫', eats: '叶子', lives: '植物上', fact: '长大后会变成蝴蝶或蛾。' },
  { id: 'frog', e: '🐸', name: '青蛙', eats: '昆虫', lives: '池塘和湿地', fact: '除了用肺，还能用皮肤呼吸。' },
  { id: 'turtle', e: '🐢', name: '乌龟', eats: '植物、小鱼、小虫', lives: '水边或陆地', fact: '龟壳是骨头的一部分，不能脱下来。' },
  { id: 'lizard', e: '🦎', name: '蜥蜴', eats: '昆虫', lives: '岩石、树上和墙上', fact: '很多蜥蜴尾巴断了还能再长出来。' },
  { id: 'owl', e: '🦉', name: '猫头鹰', eats: '老鼠和小动物', lives: '树林', fact: '头能转大约 270 度。' },
  { id: 'bat', e: '🦇', name: '蝙蝠', eats: '昆虫或水果', lives: '山洞和树洞', fact: '是唯一会真正飞行的哺乳动物。' },
  { id: 'penguin', e: '🐧', name: '企鹅', eats: '鱼和磷虾', lives: '南半球的海边', fact: '是鸟，但不会飞，游泳很厉害。' },
  { id: 'octopus', e: '🐙', name: '章鱼', eats: '螃蟹和贝类', lives: '海底', fact: '有 3 颗心脏，血是蓝色的。' },
  { id: 'dolphin', e: '🐬', name: '海豚', eats: '鱼和乌贼', lives: '海洋', fact: '睡觉时每次只让一半大脑休息。' },
  { id: 'crab', e: '🦀', name: '螃蟹', eats: '藻类、小鱼、小虾', lives: '海边和河里', fact: '大多数螃蟹横着走。' },
];
const FRUITS = `apple 苹果 apple|green-apple 青苹果 green apple|apricot 杏 apricot|avocado 牛油果 avocado|banana 香蕉 banana
|blackberry 黑莓 blackberry|blueberry 蓝莓 blueberry|prickly-pear 仙人掌果 prickly pear|cantaloupe 哈密瓜 cantaloupe
|star-fruit 杨桃 star fruit|cherimoya 番荔枝 cherimoya|cherry 樱桃 cherry|clementine 小柑橘 clementine|coconut 椰子 coconut
|date 椰枣 date|fig 无花果 fig|granadilla 甜百香果 granadilla|grape 葡萄 grape|grapefruit 西柚 grapefruit|guava 番石榴 guava
|persimmon 柿子 persimmon|kiwi 猕猴桃 kiwi|kumquat 金橘 kumquat|lemon 柠檬 lemon|lime 青柠 lime|lychee 荔枝 lychee
|mandarin 橘子 mandarin|mango 芒果 mango|mangosteen 山竹 mangosteen|melon 甜瓜 melon|mulberry 桑葚 mulberry
|nectarine 油桃 nectarine|orange 橙子 orange|papaya 木瓜 papaya|passion-fruit 百香果 passion fruit|peach 桃子 peach
|flat-peach 蟠桃 flat peach|pear 梨 pear|pepino 人参果 pepino|physalis 灯笼果 physalis|pineapple 菠萝 pineapple
|dragon-fruit 火龙果 dragon fruit|plum 李子 plum|pomegranate 石榴 pomegranate|pomelo 柚子 pomelo|quince 榅桲 quince
|rambutan 红毛丹 rambutan|raspberry 树莓 raspberry|redcurrant 红醋栗 redcurrant|snake-fruit 蛇皮果 snake fruit
|strawberry 草莓 strawberry|tamarillo 树番茄 tamarillo|tangelo 橘柚 tangelo|cherry-tomato 圣女果 cherry tomato
|watermelon 西瓜 watermelon`.split('|').map(s => { const [id, zh, ...en] = s.trim().split(' '); return { id, zh, en: en.join(' ') }; });
const FRUIT_QUIZ = 8;
const MATH_QUIZ = 8;
const DAILY_ROUNDS = 3;
const HANZI = `日 圆圆的太阳|月 弯弯的月牙|山 连在一起的三座山峰|水 弯弯曲曲流动的河水|火 向上跳动的火苗|木 一棵树，上面是树枝，下面是树根
|人 侧着身子站立的人|口 张开的嘴巴|目 一只横着的眼睛|耳 一只耳朵|心 心脏的样子|牛 牛的头，两只角向上弯|羊 羊的头，两只角向下弯
|马 一匹马，有长长的脸和鬃毛|鸟 一只侧面的鸟|鱼 一条鱼，有头、身子和尾巴|龟 一只乌龟，背上有壳|虎 张着大嘴、身上有花纹的老虎
|鹿 头上长着大角的鹿|象 有长鼻子的大象|犬 尾巴向上翘的狗|雨 从天上落下来的雨点|云 天上卷卷的云|田 分成一块一块的田地
|禾 穗子弯下来的庄稼|米 一粒一粒的米|门 两扇对开的门|车 有两个轮子的车|舟 一条小木船|刀 一把刀|弓 一张射箭用的弓
|大 张开手脚站着的人|小 几个小小的点|上 长线的上面有一条短线|下 长线的下面有一条短线|中 一根杆子穿过正中间
|天 一个人，特别画出了大大的头|子 小孩的大脑袋，头上有几根头发|女 双手交叉、跪坐着的人|母 在"女"字上加了两点，表示妈妈`
  .split('|').map(s => { const [zi, hint] = s.trim().split(' '); return { zi, hint }; });
const HANZI_QUIZ = 6;
const glyphSvg = (zi, k) => `<svg class="glyph" viewBox="0 0 100 100" role="img" aria-label="${k ? '小篆' : '甲骨文'}"><path d="${GLYPHS[zi][k]}"/></svg>`;
const STORE_KEY = 'oliver-bio-station';

const app = document.getElementById('app');
const today = () => new Date().toLocaleDateString('sv');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);

let state = { cards: [], fruits: [], hanzi: [], log: {}, sound: false };
try { Object.assign(state, JSON.parse(localStorage.getItem(STORE_KEY)) || {}); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };

let timers = [], keyHandler = null;
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
function reset() {
  timers.forEach(clearTimeout); timers = [];
  if (keyHandler) { document.removeEventListener('keydown', keyHandler); keyHandler = null; }
}

let audio;
function beep(freq) {
  if (!state.sound) return;
  try {
    audio = audio || new AudioContext();
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = freq; g.gain.value = 0.05;
    o.connect(g); g.connect(audio.destination);
    o.start(); o.stop(audio.currentTime + 0.12);
  } catch (e) {}
}

function speak(text) {
  if (!state.sound) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}

const soundBtn = document.getElementById('soundBtn');
const paintSound = () => { soundBtn.textContent = state.sound ? '🔊 声音：开' : '🔇 声音：关'; };
soundBtn.onclick = () => { state.sound = !state.sound; save(); paintSound(); beep(660); };
document.getElementById('homeBtn').onclick = () => home();
paintSound();

function cardHtml(a) {
  return `<div class="card"><div class="pic">${a.e}</div><h3>${a.name}</h3>
    <p><b>吃什么：</b>${a.eats}</p><p><b>住哪里：</b>${a.lives}</p><p><b>最酷的事：</b>${a.fact}</p></div>`;
}

function home() {
  reset();
  const done = state.log[today()] || 0;
  const rest = done >= DAILY_ROUNDS
    ? `<p class="hint">🌳 今天已经完成 ${done} 轮观察了！让眼睛休息一下，去看看真正的大自然吧。</p>`
    : `<p class="progress">今天的观察任务：${'✅'.repeat(done)}${'⬜'.repeat(DAILY_ROUNDS - done)}</p>`;
  app.innerHTML = `
    <p class="hint">你好，小生物学家！今天想做哪种观察？</p>
    ${rest}
    <div class="menu">
      <button data-go="find"><span class="big">🔍</span>找一找<small>在草地里找到目标动物</small></button>
      <button data-go="wait"><span class="big">📷</span>拍一拍<small>只拍目标动物，别的要忍住</small></button>
      <button data-go="memory"><span class="big">🧠</span>记一记<small>记住动物出现的顺序</small></button>
      <button data-go="fruit"><span class="big">🍎</span>认水果<small>看图片，选出英语名字</small></button>
      <button data-go="math"><span class="big">🧮</span>算一算<small>数数小动物，做加减法</small></button>
      <button data-go="hanzi"><span class="big">🐢</span>甲骨文<small>猜猜古人画的是哪个字</small></button>
      <button data-go="book"><span class="big">📖</span>我的图鉴<small>动物 ${state.cards.length} / ${ANIMALS.length}，水果 ${state.fruits.length} / ${FRUITS.length}，汉字 ${state.hanzi.length} / ${HANZI.length}</small></button>
    </div>
    <details><summary>给家长的说明</summary>
      <p>每轮约 2–3 分钟，建议每天 ${DAILY_ROUNDS} 轮。点错不扣分、不计时，每完成一轮就解锁一张卡片，奖励的是"做完"，不是"做对"。</p>
      <p>找一找练选择性注意，拍一拍练冲动控制，记一记练工作记忆。解锁的卡片可以抄到纸质分类卡上，周日小讲座时用。</p>
      <p>认水果每轮 ${FRUIT_QUIZ} 题，优先出还没认识的水果；第一次就选对才算"认识"。打开声音后，选对时会读出英语单词。</p>
      <p>算一算每轮 ${MATH_QUIZ} 题，是 10 以内的加减法。每道题都配有可以数的小动物，算不出来就让他数一数。</p>
      <p>甲骨文每轮 ${HANZI_QUIZ} 个字，共 ${HANZI.length} 个象形字。先看甲骨文猜字，选对后展示"甲骨文 → 小篆 → 今天"的演变。字形说明是给孩子的简化讲法，个别字的本义学界有不同看法。</p>
      <p>甲骨文字形来自 Oracular 鏡原甲骨文字体（Peichao Qin），小篆字形来自开元小篆与全字库说文解字，均有开放授权，详见
        <a href="https://github.com/ToniZhang77/oliver-bio-game/blob/main/CREDITS.md">CREDITS.md</a>。</p>
      <p>水果照片来自 <a href="https://github.com/fruits-360/fruits-360-100x100">Fruits-360 数据集</a>（Mihai Oltean），
        <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> 许可。</p>
    </details>`;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => ({ find: playFind, wait: playWait, memory: playMemory, fruit: playFruit, math: playMath, hanzi: playHanzi, book })[b.dataset.go]());
}

function book() {
  reset();
  app.innerHTML = `<p class="hint">📖 我的图鉴（${state.cards.length} / ${ANIMALS.length}）</p>` +
    ANIMALS.map(a => state.cards.includes(a.id) ? cardHtml(a)
      : `<div class="card locked"><div class="pic">❓</div><h3>还没发现</h3><p>完成一轮观察来解锁</p></div>`).join('') +
    `<p class="hint">🍎 水果图鉴（${state.fruits.length} / ${FRUITS.length}）</p><div class="tiles">` +
    FRUITS.map(f => { const known = state.fruits.includes(f.id); return `<div class="tile${known ? ' known' : ''}">
      <img src="fruits/${f.id}.jpg" alt="${f.zh}" loading="lazy"><div>${f.zh}</div><small>${known ? f.en : '？？？'}</small></div>`; }).join('') + '</div>' +
    `<p class="hint">🐢 汉字图鉴（${state.hanzi.length} / ${HANZI.length}）</p><div class="tiles">` +
    HANZI.map(h => { const known = state.hanzi.includes(h.zi); return `<div class="tile${known ? ' known' : ''}">
      <div class="mini">${glyphSvg(h.zi, 0)}</div><div>${known ? h.zi : '？'}</div></div>`; }).join('') + '</div>';
}

function playHanzi() {
  reset();
  const known = h => state.hanzi.includes(h.zi);
  const quiz = shuffle(HANZI.filter(h => !known(h))).concat(shuffle(HANZI.filter(known))).slice(0, HANZI_QUIZ);
  let i = 0, firstTry = 0;
  (function next() {
    if (i === quiz.length) return finish(`你认了 ${quiz.length} 个甲骨文，其中 ${firstTry} 个一次就猜对了。`);
    const h = quiz[i];
    const options = shuffle([h, ...sample(HANZI.filter(x => x !== h), 3)]);
    let tries = 0;
    app.innerHTML = `<p class="progress">第 ${i + 1} / ${quiz.length} 个字</p>
      <div id="top"><div class="bone">${glyphSvg(h.zi, 0)}</div>
      <p class="hint">三千多年前的人这样写字。猜猜这是哪个字？</p></div>
      <div class="options nums hanzi">${options.map((o, k) => `<button data-k="${k}">${o.zi}</button>`).join('')}</div>
      <p class="msg" id="msg"></p>`;
    const msg = document.getElementById('msg');
    const buttons = app.querySelectorAll('.options button');
    buttons.forEach(b => b.onclick = () => {
      if (options[b.dataset.k] !== h) {
        tries++; b.disabled = true; b.classList.add('nope');
        msg.textContent = '不是这个，再看看它像什么。';
        return;
      }
      buttons.forEach(x => x.disabled = true);
      b.classList.add('found');
      beep(660);
      if (tries === 0) { firstTry++; if (!known(h)) { state.hanzi.push(h.zi); save(); } }
      document.getElementById('top').innerHTML = `<p class="hint">对了，是"${h.zi}"！看看它是怎么变的：</p>
        <div class="evo">
          <figure><div class="box old">${glyphSvg(h.zi, 0)}</div><figcaption>甲骨文<br>约 3300 年前</figcaption></figure>
          <span class="arrow" style="animation-delay: 0.5s">➜</span>
          <figure style="animation-delay: 0.9s"><div class="box old">${glyphSvg(h.zi, 1)}</div><figcaption>小篆<br>约 2200 年前</figcaption></figure>
          <span class="arrow" style="animation-delay: 1.4s">➜</span>
          <figure style="animation-delay: 1.8s"><div class="box">${h.zi}</div><figcaption>今天<br>我们写的字</figcaption></figure>
        </div>`;
      msg.innerHTML = `甲骨文画的是：${h.hint}。<br><button class="primary" id="go">${i + 1 === quiz.length ? '完成' : '下一个字'}</button>`;
      document.getElementById('go').onclick = () => { i++; next(); };
    });
  })();
}

function playFruit() {
  reset();
  const known = f => state.fruits.includes(f.id);
  const quiz = shuffle(FRUITS.filter(f => !known(f))).concat(shuffle(FRUITS.filter(known))).slice(0, FRUIT_QUIZ);
  let i = 0, firstTry = 0;
  (function next() {
    if (i === quiz.length) return finish(`你认了 ${quiz.length} 种水果，其中 ${firstTry} 种一次就选对了。`);
    const f = quiz[i];
    const options = shuffle([f, ...sample(FRUITS.filter(x => x !== f), 3)]);
    let tries = 0;
    app.innerHTML = `<p class="progress">第 ${i + 1} / ${quiz.length} 种水果</p>
      <img class="fruit-pic" src="fruits/${f.id}.jpg" alt="${f.zh}">
      <p class="fruit-name">${f.zh}</p>
      <p class="hint">它的英语名字是哪一个？</p>
      <div class="options">${options.map((o, k) => `<button data-k="${k}" lang="en">${o.en}</button>`).join('')}</div>
      <p class="msg" id="msg"></p>`;
    const msg = document.getElementById('msg');
    const buttons = app.querySelectorAll('.options button');
    buttons.forEach(b => b.onclick = () => {
      if (options[b.dataset.k] !== f) {
        tries++; b.disabled = true; b.classList.add('nope');
        msg.textContent = '不是这个，再试试。';
        return;
      }
      buttons.forEach(x => x.disabled = true);
      b.classList.add('found');
      msg.textContent = `对了！${f.zh} 是 ${f.en}`;
      beep(660); speak(f.en);
      if (tries === 0) { firstTry++; if (!known(f)) { state.fruits.push(f.id); save(); } }
      i++; later(next, 1800);
    });
  })();
}

function playMath() {
  reset();
  const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
  let i = 0, firstTry = 0;
  (function next() {
    if (i === MATH_QUIZ) return finish(`你算了 ${MATH_QUIZ} 道题，其中 ${firstTry} 道一次就算对了。`);
    const animal = sample(ANIMALS, 1)[0], add = Math.random() < 0.5;
    const a = add ? rand(1, 9) : rand(2, 10), b = add ? rand(1, 10 - a) : rand(1, a);
    const answer = add ? a + b : a - b;
    const options = [answer, ...shuffle([...Array(11).keys()].filter(n => n !== answer))
      .sort((x, y) => Math.abs(x - answer) - Math.abs(y - answer)).slice(0, 3)].sort((x, y) => x - y);
    const pics = (n, cls) => Array.from({ length: n }, (_, k) =>
      `<span class="${cls}" style="animation-delay: ${0.5 + k * 0.15}s">${animal.e}</span>`).join('');
    const story = add
      ? `草地上有 ${a} 只${animal.name}，又来了 ${b} 只。现在一共有几只？`
      : `草地上有 ${a} 只${animal.name}，走了 ${b} 只。还剩几只？`;
    let tries = 0;
    app.innerHTML = `<p class="progress">第 ${i + 1} / ${MATH_QUIZ} 题</p>
      <p class="hint">${story}</p>
      <div class="scene">${add ? pics(a, '') + pics(b, 'in') : pics(a - b, '') + pics(b, 'out')}</div>
      <p class="equation" id="eq">${a} ${add ? '+' : '−'} ${b} = ?</p>
      <div class="options nums">${options.map(n => `<button>${n}</button>`).join('')}</div>
      <p class="msg" id="msg"></p>`;
    const msg = document.getElementById('msg');
    const buttons = app.querySelectorAll('.options button');
    buttons.forEach(b2 => b2.onclick = () => {
      if (+b2.textContent !== answer) {
        tries++; b2.disabled = true; b2.classList.add('nope');
        msg.textContent = '再数一数小动物。';
        return;
      }
      buttons.forEach(x => x.disabled = true);
      b2.classList.add('found');
      document.getElementById('eq').textContent = `${a} ${add ? '+' : '−'} ${b} = ${answer}`;
      msg.textContent = '算对了！';
      beep(660);
      if (tries === 0) firstTry++;
      i++; later(next, 1500);
    });
  })();
}

function finish(summary) {
  reset();
  state.log[today()] = (state.log[today()] || 0) + 1;
  const locked = ANIMALS.filter(a => !state.cards.includes(a.id));
  let reward = '<p class="hint">🏆 你已经集齐了全部卡片，是真正的专家了！</p>';
  if (locked.length) {
    const a = sample(locked, 1)[0];
    state.cards.push(a.id);
    reward = `<p class="hint">你发现了一张新卡片：</p>${cardHtml(a)}`;
  }
  save();
  beep(880);
  app.innerHTML = `<p class="hint">🎉 观察完成！${summary}</p>${reward}
    <p><button class="primary" id="back">回营地</button></p>`;
  document.getElementById('back').onclick = home;
}

function playFind() {
  reset();
  const levels = [[4, 3, 3], [5, 4, 4], [6, 4, 4], [6, 5, 5], [7, 5, 5]]; // 列, 行, 目标数
  let round = 0;
  (function next() {
    if (round === levels.length) return finish(`你搜索了 ${levels.length} 片草地，观察得很仔细。`);
    let [cols, rows, nTarget] = levels[round];
    if (innerWidth < 600 && cols > rows) [cols, rows] = [rows, cols];
    const [target, ...others] = sample(ANIMALS, 2 + Math.min(round + 2, 5));
    let cells = Array.from({ length: cols * rows }, (_, i) => i < nTarget ? target : others[Math.floor(Math.random() * others.length)]);
    cells = shuffle(cells);
    let left = nTarget;
    app.innerHTML = `<p class="progress">第 ${round + 1} / ${levels.length} 片草地</p>
      <p class="hint">找到所有的 <span class="emoji">${target.e}</span> ${target.name}，还有 <b id="left">${left}</b> 只</p>
      <div class="grid" style="--cols: ${cols}">
        ${cells.map((a, i) => `<button data-i="${i}" aria-label="${a.name}">${a.e}</button>`).join('')}
      </div><p class="msg" id="msg"></p>`;
    const msg = document.getElementById('msg');
    app.querySelectorAll('.grid button').forEach(b => b.onclick = () => {
      const a = cells[b.dataset.i];
      if (a === target) {
        b.classList.add('found'); b.disabled = true; beep(660);
        document.getElementById('left').textContent = --left;
        msg.textContent = '找到了！';
        if (left === 0) { msg.textContent = '这片草地找完了！'; round++; later(next, 900); }
      } else {
        b.classList.add('nope'); later(() => b.classList.remove('nope'), 500);
        msg.textContent = `这是${a.name}，再找找${target.name}。`;
      }
    });
  })();
}

function playWait() {
  reset();
  const TRIALS = 16, SHOW_MS = 1500, GAP_MS = 800;
  const [target, ...others] = sample(ANIMALS, 4);
  const seq = shuffle(Array.from({ length: TRIALS }, (_, i) => i < 11 ? target : others[i % others.length]));
  let i = -1, current = null, answered = true, hits = 0, holds = 0;

  app.innerHTML = `<p class="hint">你是野生动物摄影师。只拍 <span class="emoji">${target.e}</span> ${target.name}！<br>
      别的动物出现时，忍住不要拍。</p>
    <p class="progress" id="count">准备好了就开始</p>
    <div class="stage" id="stage">🌿</div>
    <p class="msg" id="msg"></p>
    <p><button class="primary" id="shoot">▶️ 开始</button></p>
    <p class="progress">也可以按空格键拍照</p>`;
  const stage = document.getElementById('stage'), msg = document.getElementById('msg'), btn = document.getElementById('shoot');

  function trial() {
    if (++i === TRIALS) return finish(`你拍到了 ${hits} 张${target.name}，还成功忍住了 ${holds} 次。`);
    current = seq[i]; answered = false;
    stage.textContent = current.e; msg.textContent = '';
    document.getElementById('count').textContent = `第 ${i + 1} / ${TRIALS} 只`;
    later(() => {
      if (!answered && current !== target) { holds++; msg.textContent = '👍 忍住了！'; }
      else if (!answered) msg.textContent = `${target.name}飞走了，没关系。`;
      answered = true; stage.textContent = '🌿';
      later(trial, GAP_MS);
    }, SHOW_MS);
  }
  function shoot() {
    if (answered) return;
    answered = true;
    if (current === target) { hits++; msg.textContent = '📸 拍到了！'; beep(660); }
    else msg.textContent = `这是${current.name}，下次忍住哦。`;
  }
  let started = false;
  btn.onclick = () => { if (!started) { started = true; btn.textContent = '📷 拍照'; btn.onclick = shoot; later(trial, 600); } };
  keyHandler = e => { if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) btn.onclick(); } };
  document.addEventListener('keydown', keyHandler);
}

function playMemory() {
  reset();
  const ROUNDS = 5;
  let round = 0, len = 2, best = 0;

  function next(retrySeq) {
    if (!retrySeq && round === ROUNDS) return finish(`你最多记住了 ${best} 只动物的顺序。`);
    const choices = retrySeq ? retrySeq.choices : sample(ANIMALS, 6);
    const seq = retrySeq ? retrySeq.seq : sample(choices, len);
    app.innerHTML = `<p class="progress">第 ${round + 1} / ${ROUNDS} 次</p>
      <p class="hint" id="hint">仔细看，记住 ${seq.length} 只动物出现的顺序</p>
      <div class="stage" id="stage">🌿</div>
      <div class="slots" id="slots"></div>
      <div class="grid" id="choices" style="--cols: ${innerWidth < 600 ? 3 : 6}"></div>
      <p class="msg" id="msg"></p>`;
    const stage = document.getElementById('stage'), msg = document.getElementById('msg');
    seq.forEach((a, k) => {
      later(() => { stage.textContent = a.e; }, 800 + k * 1200);
      later(() => { stage.textContent = '🌿'; }, 800 + k * 1200 + 900);
    });
    later(() => ask(), 800 + seq.length * 1200);

    function ask() {
      let pos = 0;
      document.getElementById('hint').textContent = '按刚才的顺序点出来';
      const slots = document.getElementById('slots');
      slots.innerHTML = seq.map(() => '<span></span>').join('');
      const box = document.getElementById('choices');
      box.innerHTML = shuffle(choices).map(a => `<button data-id="${a.id}" aria-label="${a.name}">${a.e}</button>`).join('');
      box.querySelectorAll('button').forEach(b => b.onclick = () => {
        const a = ANIMALS.find(x => x.id === b.dataset.id);
        slots.children[pos].textContent = a.e;
        if (a !== seq[pos]) {
          box.querySelectorAll('button').forEach(x => x.disabled = true);
          if (!retrySeq) { msg.textContent = '顺序不太一样，再看一次。'; later(() => next({ seq, choices }), 1500); }
          else { msg.textContent = '没关系，换一组试试。'; len = Math.max(2, len - 1); round++; later(() => next(), 1500); }
          return;
        }
        beep(660);
        if (++pos === seq.length) {
          box.querySelectorAll('button').forEach(x => x.disabled = true);
          msg.textContent = '全对！'; best = Math.max(best, seq.length);
          len = Math.min(6, len + 1); round++; later(() => next(), 1200);
        }
      });
    }
  }
  next();
}

home();
</script>
